name: Bug report
description: Report a reproducible MatlabViz problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove confidential source code and paths before submitting logs.
  - type: input
    id: matlab
    attributes:
      label: MATLAB release
      placeholder: R2026b
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: VS Code or VSCodium version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Analysis mode
      options: [Project, Folder, Auto/unknown]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized MatlabViz log
