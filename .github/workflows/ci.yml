name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '26.13.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Development dependency lifecycle scripts are not needed for this build.
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run icon:check
      - run: npm run check
      - run: npm run lint
      - run: npm run test:compile
      - run: npm test
      - run: npm run build
      - run: node -e "require('node:fs').mkdirSync('.tools/ci',{recursive:true})"
      - run: npm run package -- --out .tools/ci/package-a.vsix
        env:
          SOURCE_DATE_EPOCH: '1700000000'
      - run: npm run package:check -- .tools/ci/package-a.vsix
      - run: npm run package -- --out .tools/ci/package-b.vsix
        env:
          SOURCE_DATE_EPOCH: '1700000000'
      - name: Check repeated package bytes
        run: node -e "const fs=require('node:fs');require('node:assert/strict').ok(fs.readFileSync('.tools/ci/package-a.vsix').equals(fs.readFileSync('.tools/ci/package-b.vsix')),'Package bytes differ');"
      # This checks source/build/package portability, NOT MATLAB/editor
      # integration on Linux or a public publishing workflow. No publish step.
