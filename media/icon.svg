    <path d="m8.5 8.5 7 7m-2.7 0h2.7v-2.7"/>
    <circle cx="19" cy="5" r="2.5"/>
    <circle cx="5" cy="19" r="2.5"/>
    <circle cx="19" cy="19" r="2.5"/>
  </g>
  <circle cx="5" cy="5" r="2.75" fill="currentColor"/>
</svg>
